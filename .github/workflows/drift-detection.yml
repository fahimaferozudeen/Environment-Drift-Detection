
name: Environment Drift Detection

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Drift Detection
        id: drift_check
        continue-on-error: true
        run: python src/drift_detector.py

      - name: Generate CSV Report
        if: always()
        run: python src/report_generator.py

      - name: Generate HTML Dashboard
        if: always()
        run: python src/html_report.py

      - name: Upload Drift Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-drift-reports
          path: |
            reports/drift_report.csv
            reports/drift_dashboard.html
          if-no-files-found: error

      - name: Fail Pipeline if Production Drift Exists
        if: steps.drift_check.outcome == 'failure'
        run: |
          echo "Production drift detected. Failing the pipeline."
          exit 1
